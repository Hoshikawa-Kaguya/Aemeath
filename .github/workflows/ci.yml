name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # 依赖的许可证、安全公告和来源（配置见 deny.toml）。这个 action 只能在 Linux 上运行；
  # deny.toml 限定了只按 Windows 目标检查，所以结果与在 Windows 上运行相同
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    # 只支持 Windows 11 x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 前端：pnpm 的版本取自 app/package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Check formatting (frontend)
        working-directory: app
        run: pnpm format:check
      - name: Lint (frontend)
        working-directory: app
        run: pnpm lint
      # build 内含 vue-tsc 类型检查；产物 app/dist 是 Tauri 编译期需要的，必须在 Rust 检查之前生成
      - name: Build frontend
        working-directory: app
        run: pnpm build

      # Rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting (Rust)
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
