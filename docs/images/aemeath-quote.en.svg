  </g>

  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" text-anchor="middle">
    <text x="440" y="76" font-size="26" font-weight="700" fill="#fff1f7" letter-spacing="0.4">Every stray sound, back to one frequency.</text>
    <text x="440" y="112" font-size="19" fill="#c9d4f2" letter-spacing="0.2">All tuned up. Let me sing you a song that is only yours, okay?</text>
    <text x="440" y="142" font-size="13" fill="#ff85b6" letter-spacing="2.5">— Aemeath</text>
  </g>

