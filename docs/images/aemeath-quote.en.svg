<svg xmlns="http://www.w3.org/2000/svg" width="880" height="176" viewBox="0 0 880 176" role="img" aria-labelledby="quoteTitle quoteDesc">
  <title id="quoteTitle">A word from Aemeath at the mixing console</title>
  <desc id="quoteDesc">Aemeath: Every stray sound, back to one frequency. All tuned up. Let me sing you a song that is only yours, okay?</desc>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#121a36"/>
      <stop offset="1" stop-color="#1b1a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff85b6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff85b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff85b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff85b6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff85b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe7ff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ff85b6" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#7fe7ff" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="878.5" height="174.5" rx="26" fill="url(#card)" stroke="#ff85b6" stroke-opacity="0.32" stroke-width="1.5"/>
  <ellipse cx="440" cy="88" rx="340" ry="66" fill="url(#glow)"/>
  <rect x="24" y="0.75" width="832" height="1" fill="url(#edge)"/>

  <!-- LIVE -->
  <g font-family="'Consolas', 'Cascadia Mono', monospace">
    <circle cx="40" cy="30" r="4" fill="#ff5c8a"/>
    <circle cx="40" cy="30" r="7" fill="#ff5c8a" opacity="0.25"/>
    <text x="54" y="34" font-size="10" letter-spacing="3" fill="#ff9dbb">LIVE</text>
  </g>

  <!-- 四角星 -->
  <g fill="#ffd9e9">
    <path d="M72 84 L75 95 L86 98 L75 101 L72 112 L69 101 L58 98 L69 95 Z"/>
