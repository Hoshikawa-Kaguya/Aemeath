[package]
name = "aemeath-host"
description = "Aemeath engine process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 打包脚本打开，见 M4 计划 I5：开发构建永远使用开发身份
production-identity = ["aemeath-runtime/production-identity"]

[dependencies]
aemeath-engine = { workspace = true }
aemeath-io = { workspace = true }
aemeath-protocol = { workspace = true }
aemeath-runtime = { workspace = true }
aemeath-sys = { workspace = true }
aemeath-usbip = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = { workspace = true }

[build-dependencies]
embed-resource = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true
