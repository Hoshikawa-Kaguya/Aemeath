[package]
name = "aemeath-app"
description = "Aemeath app: control plane backend and WebView2 UI host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aemeath"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
aemeath-control = { workspace = true }
aemeath-core = { workspace = true }
aemeath-protocol = { workspace = true }
aemeath-runtime = { workspace = true }
aemeath-sys = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true, features = ["tray-icon"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing = { workspace = true }

[lints]
workspace = true
