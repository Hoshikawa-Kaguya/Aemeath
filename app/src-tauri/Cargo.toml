[package]
name = "aemeath-app"
description = "Aemeath app: control plane backend and WebView2 UI host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aemeath-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[features]
# 打包脚本打开，见 M4 计划 I5：开发构建永远使用开发身份
production-identity = ["aemeath-runtime/production-identity"]

[dependencies]
aemeath-control = { workspace = true }
aemeath-core = { workspace = true }
aemeath-protocol = { workspace = true }
aemeath-runtime = { workspace = true }
aemeath-sys = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing = { workspace = true }
velopack = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
