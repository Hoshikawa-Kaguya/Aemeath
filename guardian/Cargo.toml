[package]
name = "aemeath-guardian"
description = "Aemeath guardian process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "Aemeath"
path = "src/main.rs"

[build-dependencies]
embed-resource = { workspace = true }

[features]
# 只由打包脚本打开：开发构建永远使用开发身份，不会和正式安装的虚拟设备混在一起
production-identity = ["aemeath-runtime/production-identity"]

[dependencies]
aemeath-control = { workspace = true }
aemeath-core = { workspace = true }
aemeath-runtime = { workspace = true }
aemeath-sys = { workspace = true }
aemeath-usbip = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tracing = { workspace = true }
sha2 = { workspace = true }
velopack = { workspace = true }

[lints]
workspace = true
