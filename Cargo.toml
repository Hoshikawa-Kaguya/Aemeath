[workspace]
resolver = "3"
members = [
    "crates/aemeath-protocol",
    "crates/aemeath-sys",
    "crates/aemeath-runtime",
    "engine/aemeath-usbip",
    "engine/aemeath-io",
    "engine/aemeath-dsp",
    "engine/aemeath-engine",
    "engine/aemeath-host",
    "app/crates/aemeath-core",
    "app/crates/aemeath-control",
    "app/src-tauri",
    "guardian",
    "tools/aemeath-dev-cleanup",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# 内部 crate
aemeath-protocol = { path = "crates/aemeath-protocol" }
aemeath-sys = { path = "crates/aemeath-sys" }
aemeath-runtime = { path = "crates/aemeath-runtime" }
aemeath-usbip = { path = "engine/aemeath-usbip" }
aemeath-io = { path = "engine/aemeath-io" }
aemeath-dsp = { path = "engine/aemeath-dsp" }
aemeath-engine = { path = "engine/aemeath-engine" }
aemeath-core = { path = "app/crates/aemeath-core" }
aemeath-control = { path = "app/crates/aemeath-control" }

# 第三方
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = "0.62.2"
windows-core = "0.62.2"
# MMCSS "Pro Audio" 线程优先级（MPL-2.0，选型报告 6.1 节）
audio_thread_priority = "0.38.0"
# WASAPI 设备 IO（MIT，选型报告 6.1 节）
wasapi = "0.27.0"
# 重采样（MIT，S5）
rubato = "5.0.1"
# 实时安全的无锁 SPSC 环形缓冲（MIT/Apache，选型报告 6.1 节）
rtrb = "0.4.1"
# 引擎进程的命名管道 IPC（MIT）
tokio = "1.54.1"
# 按天轮转的非阻塞文件日志（MIT）
tracing-appender = "0.2.5"
# 固定在 Tauri 2：crates.io 上的最新版已是 3.0 alpha（ADR-0013）
tauri = "2.12.5"
tauri-build = "2.7.4"
embed-resource = "3.0.12"

# 除 aemeath-sys 外一律禁止 unsafe：Windows 调用都集中在 aemeath-sys，由它提供安全的封装（ADR-0008）
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
# 引擎要求出错时快速失败、干净退出，由守护进程拉起（ADR-0008）；主程序和守护进程同样适用
panic = "abort"
