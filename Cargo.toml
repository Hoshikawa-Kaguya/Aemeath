[workspace]
resolver = "3"
members = [
    "crates/aemeath-protocol",
    "crates/aemeath-sys",
    "crates/aemeath-runtime",
    "engine/aemeath-usbip",
    "engine/aemeath-io",
    "engine/aemeath-dsp",
    "engine/aemeath-engine",
    "engine/aemeath-host",
    "app/crates/aemeath-core",
    "app/crates/aemeath-control",
    "app/src-tauri",
    "guardian",
    "tools/aemeath-dev-cleanup",
]

[workspace.package]
# 程序版本号在 scripts/version.json，代码读 aemeath_runtime::VERSION
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# 内部 crate
aemeath-protocol = { path = "crates/aemeath-protocol" }
aemeath-sys = { path = "crates/aemeath-sys" }
aemeath-runtime = { path = "crates/aemeath-runtime" }
aemeath-usbip = { path = "engine/aemeath-usbip" }
aemeath-io = { path = "engine/aemeath-io" }
aemeath-dsp = { path = "engine/aemeath-dsp" }
aemeath-engine = { path = "engine/aemeath-engine" }
aemeath-core = { path = "app/crates/aemeath-core" }
aemeath-control = { path = "app/crates/aemeath-control" }

# 第三方
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = "0.62.2"
windows-core = "0.62.2"
# WASAPI 设备 IO（MIT）
wasapi = "0.27.0"
# 重采样（MIT）
rubato = "5.0.1"
# 实时安全的无锁 SPSC 环形缓冲（MIT/Apache）
rtrb = "0.4.1"
# 引擎进程的命名管道 IPC（MIT）
tokio = "1.54.1"
# 按天轮转的非阻塞文件日志（MIT）
tracing-appender = "0.2.5"
# 固定在 Tauri 2：crates.io 上的最新版已是 3.0 alpha
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8"
flacenc = { version = "0.5.1", default-features = false }
hound = "3.5.1"
claxon = "0.4.3"
embed-resource = "3.0.12"
# 安装、便携版与更新（MIT）。用稳定版，crates.io 最新的 1.3.39-g8d2844f 是预发布式版本
velopack = "=1.2.161"
# 校验随包附带的驱动安装程序（纯 Rust）
sha2 = "0.11"

# 除 aemeath-sys 外一律禁止 unsafe：Windows 调用都集中在 aemeath-sys，由它提供安全的封装
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# 开发版也要能实时处理：不优化时每路重采样占一个核的约 19%，优化后约 2%
[profile.dev.package.rubato]
opt-level = 3

[profile.release]
opt-level = 3
# 整个程序一起优化：编译慢很多，但跨 crate 内联能让混音和格式转换的热路径更快
lto = "fat"
codegen-units = 1
# 只带函数名和行号的 .pdb，不随程序分发
debug = "line-tables-only"
# 引擎要求出错时快速失败、干净退出，由守护进程拉起；主程序和守护进程同样适用
panic = "abort"
